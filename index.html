22221<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام الدرجات – نموذج بديل</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body bgcolor="blue">

<div class="container">

    <div class="header">
        <h1>نظام تسجيل درجات الطلاب</h1>
        <span>نموذج أكاديمي معتمد</span>
    </div>

    <form class="form-box">

        <div class="row">
            <div class="group">
                <label>اسم الطالب</label>
                <input type="text" required>
            </div>
            <div class="group">
                <label>العمر</label>
                <input type="number" required>
            </div>
        </div>

        <div class="row">
            <div class="group full">
                <label>الصف الدراسي</label>
                <input type="text" required>
            </div>
        </div>

        <div class="divider">درجات المواد</div>

        <div class="subjects">

            <div class="group">
                <label>القرآن</label>
                <input type="number" id="quran" value="0">
            </div>
            <div class="group">
                <label>إسلامية</label>
                <input type="number" id="islamic" value="0">
            </div>
            <div class="group">
                <label>علوم</label>
                <input type="number" id="science" value="0">
            </div>
            <div class="group">
                <label>عربي</label>
                <input type="number" id="arabic" value="0">
            </div>
            <div class="group">
                <label>إنجليزي</label>
                <input type="number" id="english" value="0">
            </div>
            <div class="group">
                <label>رياضيات</label>
                <input type="number" id="math" value="0">
            </div>

        </div>

        <div class="results">

            <div class="result-box">
                <span>المجموع</span>
                <input type="text" id="total" readonly>
            </div>

            <div class="result-box">
                <span>المعدل</span>
                <input type="text" id="average" readonly>
            </div>

            <div class="result-box grade-box">
                <span>التقدير</span>
                <input type="text" id="final_grade" readonly>
            </div>

        </div>

        <button type="submit">حفظ البيانات</button>

    </form>

</div>

<script>
const subs = ['quran','islamic','science','arabic','english','math'];
subs.forEach(id => {
    document.getElementById(id).addEventListener('input', calc);
});

function calc(){
    let total = 0;
    subs.forEach(id=>{
        total += parseFloat(document.getElementById(id).value) || 0;
    });

    let avg = (total / subs.length).toFixed(2);

    document.getElementById('total').value = total;
    document.getElementById('average').value = avg;

    let g='';
    if(avg>=90) g='ممتاز';
    else if(avg>=80) g='جيد جداً';
    else if(avg>=70) g='جيد';
    else if(avg>=60) g='مقبول';
    else g='راسب';

    document.getElementById('final_grade').value = g;
}
</script>

</body>
</html>
